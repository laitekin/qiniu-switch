<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qiniu Switch · 模型广场交互原型</title>
    <style>
      :root {
        --blue: #1677ff;
        --ink: #182536;
        --muted: #8893a2;
        --line: #e8edf3;
        --bg: #f6f8fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus,
      textarea:focus {
        outline: 2px solid #9cc8ff;
        outline-offset: 3px;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
      }
      img {
        object-fit: contain;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      a {
        touch-action: manipulation;
      }
      [hidden] {
        display: none !important;
      }
      header {
        background: #ffffffed;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .topbar {
        max-width: 1380px;
        margin: auto;
        height: 76px;
        padding: 0 32px;
        display: flex;
        align-items: center;
        gap: 38px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        color: var(--blue);
        font-size: 21px;
        white-space: nowrap;
      }
      .brand img {
        width: 36px;
        height: 36px;
      }
      .main-nav {
        display: flex;
        align-self: stretch;
        gap: 28px;
      }
      .main-nav button {
        position: relative;
        font-weight: 600;
        color: #768295;
        padding: 0 4px;
      }
      .main-nav button.active {
        color: var(--blue);
      }
      .main-nav button.active:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--blue);
        border-radius: 3px;
      }
      .header-end {
        margin-left: auto;
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .prototype-tag {
        color: #8c96a3;
        border: 1px solid #dfe5ed;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 5px;
      }
      .connection {
        color: #388c70;
        font-size: 12px;
      }
      .connection:before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #42b88b;
        border-radius: 50%;
        margin-right: 6px;
      }
      main {
        max-width: 1380px;
        margin: auto;
        padding: 32px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 25px;
      }
      h1 {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.6px;
      }
      .subtitle {
        color: #8a95a4;
        margin-top: 5px;
        font-size: 13px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        border: 1px solid #e0e6ee;
        background: white;
        border-radius: 8px;
        white-space: nowrap;
        color: #59667a;
      }
      .button:hover {
        border-color: #9fc6ff;
        color: var(--blue);
      }
      .button.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .button.primary:hover {
        background: #0867eb;
      }
      .button.small {
        padding: 6px 12px;
        font-size: 12px;
      }
      .button.ghost {
        background: transparent;
      }
      .filter-area {
        padding: 22px 24px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 25px;
      }
      .search-line {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .search-box {
        position: relative;
        max-width: 650px;
        flex: 1;
      }
      .search-box span {
        position: absolute;
        left: 15px;
        top: 9px;
        font-size: 20px;
        color: #a1adbd;
      }
      .search-box input {
        border: 1px solid #e2e8f1;
        border-radius: 8px;
        padding: 11px 15px 11px 44px;
        width: 100%;
        background: #fafcff;
        font-size: 13px;
      }
      .filter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .filter-label {
        font-size: 12px;
        color: #98a2b1;
        margin-right: 10px;
        min-width: 28px;
      }
      .chip {
        padding: 4px 12px;
        border-radius: 6px;
        color: #788498;
        font-size: 12px;
      }
      .chip:hover {
        background: #f5f8fc;
      }
      .chip.active {
        background: #eaf3ff;
        color: var(--blue);
        font-weight: 600;
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        font-weight: 600;
        font-size: 15px;
      }
      .count {
        font-size: 12px;
        font-weight: 400;
        color: #9aa4b2;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .model-card {
        padding: 22px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        transition:
          box-shadow 0.18s,
          transform 0.18s;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .model-card:hover {
        box-shadow: 0 7px 24px #172d5710;
        transform: translateY(-2px);
      }
      .model-title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .model-logo {
        height: 42px;
        width: 42px;
        border: 1px solid #edf1f6;
        border-radius: 12px;
        padding: 7px;
        background: #fff;
      }
      .model-title h3 {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
      }
      .vendor {
        font-size: 11px;
        color: #9ba5b3;
        margin-top: 3px;
      }
      .model-card .description {
        color: #818c9e;
        font-size: 12px;
        line-height: 1.9;
        min-height: 47px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .tags span {
        font-size: 10px;
        background: #f4f6f9;
        padding: 2px 7px;
        border-radius: 4px;
        color: #7a8799;
      }
      .card-bottom {
        margin-top: auto;
      }
      .price-line {
        margin: 19px 0 15px;
        font-size: 11px;
        color: #97a2b1;
        padding-top: 15px;
        border-top: 1px solid #f0f3f7;
        display: flex;
        justify-content: space-between;
      }
      .text-button {
        color: var(--blue);
        padding: 0;
        font-size: 11px;
      }
      .card-actions {
        display: flex;
        gap: 9px;
      }
      .card-actions .button {
        flex: 1;
        font-size: 12px;
        padding: 8px 5px;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 65px;
        color: #9aa5b5;
      }
      .tip {
        margin-top: 22px;
        color: #a0a9b6;
        font-size: 11px;
      }
      .client-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      .app-switcher {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        background: #eceff4;
        padding: 6px;
        border-radius: 15px;
        max-width: 100%;
      }
      .app-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 74px;
        padding: 10px 5px 7px;
        border-radius: 10px;
        color: #939daa;
        font-size: 10px;
        white-space: nowrap;
      }
      .app-tab img {
        width: 25px;
        height: 25px;
        opacity: 0.6;
      }
      .app-tab.active {
        color: var(--blue);
        background: white;
        box-shadow: 0 2px 7px #1b355c10;
      }
      .app-tab.active img {
        opacity: 1;
      }
      .provider-row {
        display: flex;
        align-items: center;
        gap: 18px;
        border: 1px solid #e0e5ed;
        background: white;
        border-radius: 16px;
        padding: 25px 28px;
      }
      .provider-row.highlight {
        border-color: #8fbaff;
        box-shadow: 0 0 0 4px #dcecff80;
      }
      .drag {
        color: #c3cad4;
        font-size: 20px;
        letter-spacing: -2px;
      }
      .provider-logo {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #f5f8fc;
        padding: 9px;
        border: 1px solid #e9edf3;
      }
      .provider-info {
        flex: 1;
        min-width: 0;
      }
      .provider-info h2 {
        font-size: 20px;
        font-weight: 600;
      }
      .website {
        font-size: 13px;
        color: var(--blue);
      }
      .provider-model {
        margin-top: 8px;
        font-size: 12px;
        color: #718096;
        overflow-wrap: anywhere;
      }
      .provider-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .state-tag {
        color: #26a17e;
        background: #eaf8f2;
        padding: 3px 9px;
        border-radius: 5px;
        font-size: 11px;
        white-space: nowrap;
      }
      .client-hint {
        margin-top: 28px;
        border: 1px dashed #dae3ef;
        border-radius: 12px;
        padding: 22px;
        color: #8b97a8;
        font-size: 13px;
        text-align: center;
      }
      .client-hint button {
        color: var(--blue);
        font-weight: 600;
      }
      dialog {
        border: 1px solid #e2e9f2;
        border-radius: 18px;
        padding: 0;
        width: min(650px, calc(100vw - 32px));
        box-shadow: 0 25px 100px #152a4a25;
        color: var(--ink);
      }
      dialog::backdrop {
        background: #13294455;
        backdrop-filter: blur(2px);
      }
      .dialog-head {
        padding: 22px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }
      .dialog-head h2 {
        font-size: 19px;
      }
      .close {
        font-size: 21px;
        color: #9aa7b8;
        width: 30px;
        height: 30px;
        border-radius: 6px;
      }
      .close:hover {
        background: #f2f5f9;
      }
      .dialog-body {
        padding: 22px 25px;
      }
      .selected-model {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 15px;
        border-radius: 10px;
        background: #f7faff;
        margin-bottom: 22px;
      }
      .selected-model img {
        width: 32px;
        height: 32px;
      }
      .selected-model small {
        display: block;
        color: #8a98a9;
        font-size: 11px;
      }
      .field-label {
        font-size: 12px;
        color: #788697;
        margin-bottom: 10px;
      }
      .client-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px;
      }
      .client-choice {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 9px;
        border: 1px solid #e4eaf1;
        border-radius: 8px;
        font-size: 11px;
        min-width: 0;
      }
      .client-choice img {
        width: 22px;
        height: 22px;
      }
      .client-choice.active {
        color: var(--blue);
        background: #f0f7ff;
        border-color: #88baff;
      }
      .account-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fafbfd;
        padding: 13px 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 12px;
      }
      .account-row small {
        color: #99a4b4;
      }
      .dialog-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 25px;
        border-top: 1px solid var(--line);
        gap: 15px;
      }
      .dialog-footer small {
        font-size: 11px;
        color: #97a3b2;
      }
      .dialog-buttons {
        display: flex;
        gap: 9px;
      }
      .model-details {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 12px;
        font-size: 13px;
        margin: 20px 0;
      }
      .model-details dt {
        color: #93a0b1;
      }
      .model-details dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .prototype-note {
        font-size: 11px;
        color: #9aa5b4;
        line-height: 1.8;
      }
      .chat-dialog {
        width: min(780px, calc(100vw - 32px));
      }
      .chat-messages {
        height: 330px;
        overflow-y: auto;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        background: #fbfcfe;
      }
      .bubble {
        max-width: 85%;
        padding: 13px 16px;
        border: 1px solid #e8edf5;
        background: white;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.8;
        white-space: pre-wrap;
      }
      .bubble.user {
        align-self: flex-end;
        background: #eaf3ff;
        border-color: #dceaff;
      }
      .bubble small {
        display: block;
        color: #93a5bb;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .chat-form {
        padding: 20px 25px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 12px;
      }
      .chat-form textarea {
        flex: 1;
        resize: none;
        border: 1px solid #e3e9f1;
        border-radius: 8px;
        padding: 11px;
        font-size: 13px;
        min-width: 0;
      }
      .chat-foot {
        padding: 0 25px 16px;
        font-size: 11px;
        color: #a0aab7;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 22px;
        border-radius: 10px;
        background: #1f3149;
        color: white;
        z-index: 30;
        font-size: 13px;
        box-shadow: 0 6px 24px #112b4320;
      }
      .toast:empty {
        display: none;
      }
      @media (max-width: 1000px) {
        .topbar {
          gap: 24px;
          padding: 0 22px;
        }
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .header-end .connection {
          display: none;
        }
        .client-toolbar {
          display: block;
        }
        .app-switcher {
          margin-bottom: 15px;
        }
        .client-toolbar > .button {
          display: none;
        }
        .app-tab {
          min-width: 68px;
        }
        .provider-row {
          flex-wrap: wrap;
        }
        .provider-actions {
          margin-left: auto;
        }
      }
      @media (max-width: 620px) {
        main {
          padding: 22px 16px;
        }
        .topbar {
          padding: 0 16px;
          gap: 17px;
          height: 65px;
        }
        .brand {
          font-size: 16px;
        }
        .brand img {
          width: 26px;
          height: 26px;
        }
        .main-nav {
          gap: 13px;
          font-size: 12px;
        }
        .header-end {
          display: none;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .filter-area {
          padding: 16px;
        }
        .client-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .provider-row {
          padding: 20px 16px;
        }
        .provider-info h2 {
          font-size: 17px;
        }
        .heading h1 {
          font-size: 23px;
        }
        .dialog-footer {
          flex-wrap: wrap;
        }
        .dialog-buttons {
          margin-left: auto;
        }
        .selected-model strong {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <div class="brand">
          <img src="src/assets/brand/qiniu-tray.svg" alt="" />Qiniu Switch
        </div>
        <nav class="main-nav" aria-label="主导航">
          <button
            id="nav-market"
            class="active"
            data-page="market"
            aria-current="page"
          >
            模型广场</button
          ><button id="nav-clients" data-page="clients">客户端配置</button>
        </nav>
        <div class="header-end">
          <span class="connection">七牛云 · 演示连接</span
          ><span class="prototype-tag">交互原型</span>
        </div>
      </div>
    </header>
    <main>
      <section id="market-page">
        <div class="heading">
          <div>
            <h1>模型广场</h1>
            <p class="subtitle">挑选模型，体验后配置到你常用的客户端。</p>
          </div>
          <button class="button small" id="refresh-models">↻ 刷新列表</button>
        </div>
        <div class="filter-area">
          <div class="search-line">
            <label class="search-box"
              ><span>⌕</span
              ><input
                id="model-search"
                placeholder="搜索模型名称、厂商或能力"
                aria-label="搜索模型"
            /></label>
          </div>
          <div class="filter-row" id="vendor-filters"></div>
          <div class="filter-row" id="ability-filters"></div>
        </div>
        <div class="section-label">
          探索模型 <span class="count" id="model-count"></span>
        </div>
        <div class="cards" id="model-cards"></div>
        <p class="tip">
          交互原型 · 模型为展示样例，操作仅保存在当前页面，不调用 API
          或修改本机配置。
        </p>
      </section>
      <section id="clients-page" hidden>
        <div class="heading">
          <div>
            <h1>客户端配置</h1>
            <p class="subtitle">原来的供应商管理界面，继续在这里使用。</p>
          </div>
          <button class="button" data-page="market">＋ 从模型广场添加</button>
        </div>
        <div class="client-toolbar">
          <div
            class="app-switcher"
            id="app-tabs"
            role="tablist"
            aria-label="客户端"
          ></div>
          <button class="button small" id="client-tools">客户端工具</button>
        </div>
        <div id="provider-content"></div>
        <p class="tip">
          这里演示配置应用后的状态；真正的配置写入将在桌面版中执行。
        </p>
      </section>
    </main>
    <dialog id="configure-dialog" aria-labelledby="configure-title">
      <div class="dialog-head">
        <h2 id="configure-title">配置到客户端</h2>
        <button
          class="close"
          data-close="configure-dialog"
          aria-label="关闭配置弹窗"
        >
          ×
        </button>
      </div>
      <div class="dialog-body">
        <div class="selected-model" id="configure-model"></div>
        <p class="field-label">选择目标客户端</p>
        <div
          id="client-choices"
          class="client-grid"
          role="radiogroup"
          aria-label="目标客户端"
        ></div>
        <div class="account-row">
          <span>七牛云 API Key</span><small>演示凭据 · sk-demo…0001</small>
        </div>
      </div>
      <div class="dialog-footer">
        <small>确认后自动进入对应客户端的配置页。</small>
        <div class="dialog-buttons">
          <button class="button" data-close="configure-dialog">取消</button
          ><button class="button primary" id="apply-config">确认配置</button>
        </div>
      </div>
    </dialog>
    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <div class="dialog-head">
        <h2 id="detail-title">模型详情</h2>
        <button
          class="close"
          data-close="detail-dialog"
          aria-label="关闭模型详情"
        >
          ×
        </button>
      </div>
      <div class="dialog-body" id="detail-body"></div>
      <div class="dialog-footer">
        <small>可先体验，再决定是否配置。</small>
        <div class="dialog-buttons">
          <button class="button" id="detail-chat">立即体验</button
          ><button class="button primary" id="detail-configure">
            配置到客户端
          </button>
        </div>
      </div>
    </dialog>
    <dialog id="chat-dialog" class="chat-dialog" aria-labelledby="chat-title">
      <div class="dialog-head">
        <div>
          <h2 id="chat-title">模型体验</h2>
          <p class="subtitle" id="chat-model-name"></p>
        </div>
        <button
          class="close"
          data-close="chat-dialog"
          aria-label="关闭模型体验"
        >
          ×
        </button>
      </div>
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <textarea
          id="chat-input"
          rows="2"
          placeholder="例如：帮我写一个读取 CSV 的 Python 函数"
          aria-label="输入消息"
          required
        ></textarea
        ><button class="button primary" id="send-message" type="submit">
          发送
        </button>
      </form>
      <div class="chat-foot">演示对话 · 展示操作流程，不发起模型请求。</div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      const asset = (name) =>
        name === "pi.svg"
          ? "data:image/svg+xml," +
            encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><path fill="#647084" fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/><path fill="#647084" d="M517.36 400H634.72V634.72H517.36Z"/></svg>',
            )
          : "src/icons/extracted/" + name;
      const clients = [
        ["claude", "Claude Code", "claude.svg"],
        ["claude-desktop", "Claude Desktop", "claude.svg"],
        ["codex", "Codex", "openai.svg"],
        ["workbuddy", "WorkBuddy", "workbuddy.svg"],
        ["gemini", "Gemini", "gemini.svg"],
        ["grokbuild", "Grok Build", "grok.svg"],
        ["opencode", "OpenCode", "opencode-logo-light.svg"],
        ["openclaw", "OpenClaw", "claw.svg"],
        ["hermes", "Hermes", "hermes.png"],
        ["pi", "Pi", "pi.svg"],
        ["mcode", "MiniMax Code", "minimax.svg"],
      ].map(([id, name, icon]) => ({ id, name, icon: asset(icon) }));
      const models = [
        {
          id: "deepseek-v4.1-flash",
          name: "DeepSeek-V4.1-Flash",
          vendor: "DeepSeek",
          icon: "deepseek.svg",
          tags: ["深度思考", "工具调用"],
          description: "适合复杂问题分析与日常开发，让思考和执行连接起来。",
        },
        {
          id: "glm-5.2",
          name: "GLM-5.2",
          vendor: "智谱",
          icon: "zhipu.svg",
          tags: ["AI 编程", "工具调用"],
          description: "面向编程与长任务，在你的 Agent 客户端中继续工作。",
        },
        {
          id: "kimi-k2.7-code",
          name: "Kimi-K2.7-Code",
          vendor: "Moonshot",
          icon: "kimi.svg",
          tags: ["AI 编程", "多模态"],
          description: "从理解代码到完成任务，体验面向开发工作的模型。",
        },
        {
          id: "minimax-m3",
          name: "MiniMax-M3",
          vendor: "MiniMax",
          icon: "minimax.svg",
          tags: ["多模态", "工具调用"],
          description: "探索文本与图像协作，在一个工作流中处理多种内容。",
        },
        {
          id: "hy4-preview",
          name: "Hy4 Preview",
          vendor: "腾讯混元",
          icon: "hunyuan.svg",
          tags: ["深度思考", "工具调用"],
          description: "从办公分析到复杂推理，选择适合任务的能力。",
        },
        {
          id: "qwen3.7-max",
          name: "Qwen3.7-Max",
          vendor: "Qwen",
          icon: "qwen.svg",
          tags: ["AI 编程", "深度思考"],
          description: "用于演示通用对话、代码生成与客户端配置的交互。",
        },
      ];
      const state = {
        page: "market",
        vendor: "全部",
        ability: "全部",
        activeClient: "codex",
        targetClient: "codex",
        selectedModel: null,
        configs: {},
      };
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let toastTimer, replyTimer;
      function toast(message) {
        $("toast").textContent = message;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          $("toast").textContent = "";
        }, 3500);
      }
      function setPage(page) {
        state.page = page;
        $("market-page").hidden = page !== "market";
        $("clients-page").hidden = page !== "clients";
        for (const p of ["market", "clients"]) {
          $("nav-" + p).classList.toggle("active", p === page);
          if (p === page) $("nav-" + p).setAttribute("aria-current", "page");
          else $("nav-" + p).removeAttribute("aria-current");
        }
        if (page === "clients") renderClients();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function renderFilters() {
        for (const [kind, values, label] of [
          ["vendor", ["全部", ...new Set(models.map((m) => m.vendor))], "厂商"],
          [
            "ability",
            ["全部", "AI 编程", "深度思考", "工具调用", "多模态"],
            "能力",
          ],
        ]) {
          const node = $(kind + "-filters");
          node.innerHTML =
            `<span class="filter-label">${label}</span>` +
            values
              .map(
                (value) =>
                  `<button class="chip ${state[kind] === value ? "active" : ""}" data-filter="${kind}" data-value="${value}" aria-pressed="${state[kind] === value}">${value}</button>`,
              )
              .join("");
        }
      }
      function renderModels() {
        const query = $("model-search").value.trim().toLowerCase();
        const visible = models.filter(
          (m) =>
            (state.vendor === "全部" || m.vendor === state.vendor) &&
            (state.ability === "全部" || m.tags.includes(state.ability)) &&
            [m.name, m.vendor, ...m.tags]
              .join(" ")
              .toLowerCase()
              .includes(query),
        );
        $("model-count").textContent = `${visible.length} 个展示模型`;
        $("model-cards").innerHTML =
          visible
            .map(
              (m) =>
                `<article class="model-card"><div class="model-title"><img class="model-logo" src="${asset(m.icon)}" alt=""/><div><h3>${m.name}</h3><div class="vendor">${m.vendor}</div></div></div><p class="description">${m.description}</p><div class="tags">${m.tags.map((tag) => `<span>${tag}</span>`).join("")}</div><div class="card-bottom"><div class="price-line"><span>上下文与价格 · 接口同步后展示</span><button class="text-button" data-action="detail" data-model="${m.id}">查看详情 ↗</button></div><div class="card-actions"><button class="button" data-action="chat" data-model="${m.id}">立即体验</button><button class="button primary" data-action="configure" data-model="${m.id}">配置到客户端</button></div></div></article>`,
            )
            .join("") ||
          '<div class="empty">没有匹配的模型，试试其他关键词或筛选条件。</div>';
      }
      function renderChoices() {
        $("client-choices").innerHTML = clients
          .map(
            (c) =>
              `<button class="client-choice ${state.targetClient === c.id ? "active" : ""}" role="radio" aria-checked="${state.targetClient === c.id}" data-client="${c.id}"><img src="${c.icon}" alt=""/>${c.name}</button>`,
          )
          .join("");
      }
      function openConfigure(model) {
        state.selectedModel = model;
        state.targetClient = state.activeClient;
        $("configure-model").innerHTML =
          `<img src="${asset(model.icon)}" alt=""/><div><strong>${model.name}</strong><small>${model.vendor} · 七牛云</small></div>`;
        renderChoices();
        $("configure-dialog").showModal();
      }
      function renderClients(highlight = false) {
        $("app-tabs").innerHTML = clients
          .map(
            (c) =>
              `<button class="app-tab ${c.id === state.activeClient ? "active" : ""}" role="tab" aria-selected="${c.id === state.activeClient}" data-app="${c.id}" title="${c.name}"><img src="${c.icon}" alt=""/><span>${c.name}</span></button>`,
          )
          .join("");
        const client = clients.find((c) => c.id === state.activeClient);
        const model = state.configs[client.id];
        $("provider-content").innerHTML =
          `<div class="provider-row ${highlight ? "highlight" : ""}"><span class="drag" aria-hidden="true">⠿</span><img class="provider-logo" src="src/assets/brand/qiniu-app.svg" alt="七牛云"/><div class="provider-info"><h2>七牛云</h2><span class="website">https://www.qiniu.com</span><p class="provider-model">${model ? "当前模型：" + model.name : "尚未配置模型 · " + client.name}</p></div><div class="provider-actions">${model ? '<span class="state-tag">已配置 · 演示</span><button class="button" id="change-model">更换模型</button>' : '<button class="button primary" id="change-model">选择模型</button>'}</div></div><div class="client-hint">${model ? "配置已出现在 " + client.name + " 栏目。你可以切换其他客户端查看各自配置。" : "先在模型广场挑选一个模型，再配置到 " + client.name + "。"} <button data-page="market">前往模型广场 →</button></div>`;
      }
      function openDetail(model) {
        state.selectedModel = model;
        $("detail-body").innerHTML =
          `<div class="selected-model"><img src="${asset(model.icon)}" alt=""/><div><strong>${model.name}</strong><small>${model.vendor}</small></div></div><p>${model.description}</p><dl class="model-details"><dt>模型 ID</dt><dd>${model.id}</dd><dt>能力示意</dt><dd>${model.tags.join(" · ")}</dd><dt>服务来源</dt><dd>七牛云</dd></dl><p class="prototype-note">此页为布局与交互示意。正式模型 ID、能力、价格和可用性以接口数据为准。</p>`;
        $("detail-dialog").showModal();
      }
      function openChat(model) {
        state.selectedModel = model;
        $("chat-model-name").textContent = model.name + " · 七牛云";
        $("chat-messages").innerHTML =
          '<div class="bubble"><small>演示消息</small>你好，想先用这个模型完成什么任务？</div>';
        $("chat-input").value = "";
        $("chat-dialog").showModal();
        $("chat-input").focus();
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.page) setPage(button.dataset.page);
        if (button.dataset.close) $(button.dataset.close).close();
        if (button.dataset.filter) {
          state[button.dataset.filter] = button.dataset.value;
          renderFilters();
          renderModels();
        }
        if (button.dataset.model) {
          const model = models.find((m) => m.id === button.dataset.model);
          if (button.dataset.action === "configure") openConfigure(model);
          if (button.dataset.action === "detail") openDetail(model);
          if (button.dataset.action === "chat") openChat(model);
        }
        if (button.dataset.client) {
          state.targetClient = button.dataset.client;
          renderChoices();
        }
        if (button.dataset.app) {
          state.activeClient = button.dataset.app;
          renderClients();
        }
        if (button.id === "change-model") setPage("market");
      });
      $("model-search").addEventListener("input", renderModels);
      $("apply-config").addEventListener("click", () => {
        state.configs[state.targetClient] = state.selectedModel;
        state.activeClient = state.targetClient;
        $("configure-dialog").close();
        setPage("clients");
        renderClients(true);
        toast(
          `已演示配置 ${state.selectedModel.name} → ${clients.find((c) => c.id === state.activeClient).name}`,
        );
      });
      $("detail-configure").addEventListener("click", () => {
        $("detail-dialog").close();
        openConfigure(state.selectedModel);
      });
      $("detail-chat").addEventListener("click", () => {
        $("detail-dialog").close();
        openChat(state.selectedModel);
      });
      $("refresh-models").addEventListener("click", () => {
        renderModels();
        toast("演示模型列表已刷新");
      });
      $("client-tools").addEventListener("click", () =>
        toast("客户端工具仍保留原有功能入口，本页仅演示导航与配置流程。"),
      );
      $("chat-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const value = $("chat-input").value.trim();
        if (!value) return;
        $("chat-messages").insertAdjacentHTML(
          "beforeend",
          `<div class="bubble user">${escapeHtml(value)}</div>`,
        );
        $("chat-input").value = "";
        $("send-message").disabled = true;
        replyTimer = setTimeout(() => {
          $("chat-messages").insertAdjacentHTML(
            "beforeend",
            '<div class="bubble"><small>演示回复 · 未调用模型</small>可以先把任务拆成输入、处理和输出三个步骤，再逐步补全细节。你也可以把这个模型配置到常用客户端，继续完成工作。</div>',
          );
          $("send-message").disabled = false;
          $("chat-messages").scrollTop = $("chat-messages").scrollHeight;
        }, 450);
      });
      $("chat-dialog").addEventListener("close", () => {
        clearTimeout(replyTimer);
        $("send-message").disabled = false;
      });
      renderFilters();
      renderModels();
      renderClients();
    </script>
  </body>
</html>
